<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F0F1A" />
    <title>The ARD Curriculum</title>
    <script>
      (function(){
        var mobile=window.matchMedia&&window.matchMedia('(max-width:520px)').matches;
        var saved=localStorage.getItem('ard_curriculum_theme');
        document.documentElement.dataset.ardInitialTheme=mobile?'dark':(saved||'dark');
        document.body&&document.body.setAttribute('data-theme',mobile?'dark':(saved||'dark'));
      })();
    </script>
  </head>
  <body data-theme="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <link rel="stylesheet" href="/src/glossy.css" />
    <link rel="stylesheet" href="/src/page-colors.css" />
    <link rel="stylesheet" href="/src/lesson-colors.css" />
    <link rel="stylesheet" href="/src/ard-mobile-glossy.css" />
    <link rel="stylesheet" href="/src/ard-mobile-reference.css" />
    <link rel="stylesheet" href="/src/premium-stages.css" />
    <link rel="stylesheet" href="/src/ard-premium-mobile.css" />
    <link rel="stylesheet" href="/src/ard-glossy-environment.css" />
    <link rel="stylesheet" href="/src/stage-heading-colors.css" />
    <link rel="stylesheet" href="/src/card-layout.css" />
    <link rel="stylesheet" href="/src/concept-note-colors.css" />
    <link rel="stylesheet" href="/src/tools-heading-colors.css" />
    <link rel="stylesheet" href="/src/ard-mobile-width-fix.css" />
    <link rel="stylesheet" href="/src/sidebar-premium.css" />
    <style>
      .mobile-filament{display:none}
      @media (max-width:520px){
        .mobile-filament{
          display:flex !important;
          position:fixed !important;
          top:24px !important;
          left:auto !important;
          right:16px !important;
          width:40px !important;
          height:40px !important;
          align-items:center !important;
          justify-content:center !important;
          padding:0 !important;
          margin:0 !important;
          border:0 !important;
          border-radius:9px !important;
          background:transparent !important;
          color:rgba(255,255,255,.92) !important;
          box-shadow:none !important;
          z-index:200 !important;
          pointer-events:auto !important;
        }
        .mobile-filament::before{content:'☰' !important;display:block !important;font-size:21px !important;line-height:1 !important;color:rgba(255,255,255,.92) !important;font-family:Arial,sans-serif !important}
        .mobile-filament span{display:none !important}
        body:has(.app-shell:not(.is-collapsed)) .mobile-filament{display:none !important}
      }
    </style>
  </body>
</html>
