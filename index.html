function esc(s){return String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function linkify(url,title){return `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a>`;}

let currentView = {type:'dashboard'};

const sidebar = document.getElementById('sidebar');
const mainInner = document.getElementById('mainInner');
const main = document.getElementById('main');
const progressChip = document.getElementById('progressChip');

function updateProgressChip(){
  const total=lessons.length, done=lessons.filter(l=>completed[l.id]).length;
  progressChip.textContent=`${done} / ${total} lessons complete`;
}
function toggleComplete(id){
  completed[id]=!completed[id];
  localStorage.setItem('ard-completed-lessons',JSON.stringify(completed));
  updateProgressChip(); renderSidebar();
  if(currentView.type==='lesson' && currentView.id===id) renderLesson(id);
}
function navigate(view){currentView=view; render(); main.scrollTop=0;}
function renderSidebar(){
  const top=`<div class="nav-section-label">NAVIGATION</div>
    <div class="nav-top-item ${currentView.type==='dashboard'?'active':''}" onclick="navigate({type:'dashboard'})">⌂ &nbsp; Dashboard</div>

    const stageLessons=lessons.filter(l=>l.stage===s.id);

  const s=stages.find(x=>x.id===id); if(!s)return renderDashboard();
  const stageLessons=lessons.filter(l=>l.stage===id);
  mainInner.innerHTML=`<div class="stage-view"><div class="stage-eyebrow">STAGE ${String(s.num).padStart(2,'0')}</div><h1>${esc(s.title)}</h1><p>${esc(s.objective)}</p>
  <div class="stage-meta-grid"><div class="meta-block"><h3>PREREQUISITES</h3><p>${esc(s.prerequisites)}</p></div><div class="meta-block"><h3>TECHNOLOGIES</h3><ul>${s.technologies.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="meta-block"><h3>SKILLS</h3><ul>${s.skills.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="meta-block"><h3>CONCEPTS</h3><ul>${s.concepts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="meta-block"><h3>PROJECTS</h3><ul>${s.projects.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="meta-block"><h3>ASSESSMENTS</h3><ul>${s.assessments.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  ${stageLessons.length?`<div class="stage-eyebrow">LESSONS</div><div>${stageLessons.map(l=>`<div class="concept-card" style="cursor:pointer" onclick="navigate({type:'lesson',id:'${l.id}'})"><h2>${esc(l.title)}</h2><div class="cmod">${esc(l.module)} · ${completed[l.id]?'COMPLETE':'NOT STARTED'}</div><p>${esc(l.what)}</p></div>`).join('')}</div>`:''}
  <div class="exit-box"><div class="label">EXIT CRITERIA</div><div>${esc(s.exitCriteria)}</div></div></div>`;
}
function renderLesson(id){
  const l=lessons.find(x=>x.id===id); if(!l)return renderDashboard();
  const s=stages.find(x=>x.id===l.stage);
  mainInner.innerHTML=`<div class="lesson-view"><div class="lesson-eyebrow">${esc(s?.title||'')} / ${esc(l.module)}</div><h1>${esc(l.title)}</h1>
  ${[['WHAT IS IT?',l.what],['WHY IT MATTERS',l.why],['MENTAL MODEL',l.mentalModel]].map(([h,t])=>`<div class="lsection"><h2>${h}</h2><p>${esc(t)}</p></div>`).join('')}
  <div class="lsection"><h2>CORE CONCEPTS</h2><ul>${l.coreConcepts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="lsection"><h2>EXAMPLE</h2><pre>${esc(l.example)}</pre></div>
  <div class="lsection"><h2>CODE</h2><pre>${esc(l.code)}</pre></div>
  <div class="lsection"><h2>COMMON MISTAKES</h2><ul>${l.commonMistakes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="lsection"><h2>PRACTICE</h2><p>${esc(l.practice)}</p></div>
  <div class="lsection"><h2>CHALLENGE</h2><p>${esc(l.challenge)}</p></div>
  <div class="lsection"><h2>MINI PROJECT</h2><p>${esc(l.miniProject)}</p></div>
  <div class="lsection"><h2>RESOURCES</h2>${l.resources.map(r=>`<div class="resource-item"><div class="rtitle">${linkify(r.url,r.title)}</div><div class="rnote">${esc(r.note)}</div></div>`).join('')}</div>
  <div class="lsection"><h2>MASTERY CHECKLIST</h2><ul class="mastery-list">${l.mastery.map(x=>`<li><span class="m-check">□</span><span>${esc(x)}</span></li>`).join('')}</ul></div>
  <div class="mark-complete-bar"><button class="btn ${completed[l.id]?'done':''}" onclick="toggleComplete('${l.id}')">${completed[l.id]?'✓ Completed':'Mark lesson complete'}</button><button class="btn secondary" onclick="navigate({type:'stage',id:'${l.stage}'})">Back to stage</button></div></div>`;
}
function renderProjects(){
  mainInner.innerHTML=`<div class="stage-eyebrow">BUILD</div><h1>Project Ladder</h1><p>Projects are the proof of learning. Move from tiny exercises to production-style systems and a capstone.</p>${projects.map(g=>`<div class="level-block"><div class="level-tag">${esc(g.level)}</div>${g.items.map(p=>`<div class="project-card"><h3>${esc(p.title)}</h3><div class="project-fields"><div><div class="pf-label">SKILLS</div>${esc(p.skills)}</div><div><div class="pf-label">OBJECTIVE</div>${esc(p.objective)}</div><div><div class="pf-label">REQUIREMENTS</div>${esc(p.requirements)}</div><div><div class="pf-label">STRETCH</div>${esc(p.stretch)}</div></div></div>`).join('')}</div>`).join('')}`;
}
function renderSkills(){
  mainInner.innerHTML=`<div class="stage-eyebrow">MEASURE</div><h1>Skill Matrix</h1><p>Progression is based on demonstrated ability, not time spent watching tutorials.</p><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Skill</th><th>Category</th><th>Beginner</th><th>Intermediate</th><th>Advanced</th><th>Professional</th></tr></thead><tbody>${skills.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function renderResources(){
  mainInner.innerHTML=`<div class="stage-eyebrow">REFERENCE</div><h1>Resource Library</h1><p>Prioritize official documentation, university courses, open books and reputable research. Verify availability before relying on any resource.</p>${resourceLibrary.map(r=>`<div class="resource-item"><div class="rtitle">${linkify(r.url,r.title)}</div><div class="rnote"><b>${esc(r.type)}</b> · ${esc(r.level)} · ${esc(r.cost)} — ${esc(r.note)}</div></div>`).join('')}`;
}
function renderTools(){
  mainInner.innerHTML=`<div class="stage-eyebrow">TOOLKIT</div><h1>Tools</h1><p>Learn tools when they become useful. Don't collect technologies just to collect them.</p>${tools.map(t=>`<div class="tool-card"><h3>${esc(t.name)} <span class="tool-cost">${esc(t.cost)}</span></h3><div class="trow"><b>Purpose:</b> ${esc(t.purpose)}</div><div class="trow"><b>Learn:</b> ${esc(t.when)}</div><div class="trow"><b>Alternative:</b> ${esc(t.alternative)}</div></div>`).join('')}`;
}
function render(){
  renderSidebar();
  if(currentView.type==='dashboard')renderDashboard();
  else if(currentView.type==='stage')renderStage(currentView.id);
  else if(currentView.type==='lesson')renderLesson(currentView.id);
  else if(currentView.type==='projects')renderProjects();
  else if(currentView.type==='skills')renderSkills();
  else if(currentView.type==='resources')renderResources();
  else if(currentView.type==='tools')renderTools();
}

document.getElementById('themeToggle').addEventListener('click',()=>{
  const b=document.body; b.dataset.theme=b.dataset.theme==='dark'?'light':'dark';
  localStorage.setItem('ard-theme',b.dataset.theme);
});
const savedTheme=localStorage.getItem('ard-theme'); if(savedTheme)document.body.dataset.theme=savedTheme;

const searchInput=document.getElementById('searchInput');
const searchResults=document.getElementById('searchResults');
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(!q){searchResults.classList.remove('open');return;}
  const results=[];
  stages.forEach(s=>{if((s.title+' '+s.objective+' '+s.concepts.join(' ')).toLowerCase().includes(q))results.push({type:'stage',id:s.id,title:s.title,note:'Stage'});});
  lessons.forEach(l=>{if((l.title+' '+l.module+' '+l.what+' '+l.coreConcepts.join(' ')).toLowerCase().includes(q))results.push({type:'lesson',id:l.id,title:l.title,note:l.module});});
  resourceLibrary.forEach(r=>{if((r.title+' '+r.type+' '+r.note).toLowerCase().includes(q))results.push({type:'resource',id:null,title:r.title,note:'Resource'});});
  tools.forEach(t=>{if((t.name+' '+t.purpose).toLowerCase().includes(q))results.push({type:'tool',id:null,title:t.name,note:'Tool'});});
  const limited=results.slice(0,12);
  searchResults.innerHTML=limited.length?limited.map(r=>`<div class="search-result-item" onclick="${r.type==='resource'?'navigate({type:\'resources\'})':r.type==='tool'?'navigate({type:\'tools\'})':`navigate({type:'${r.type}',id:'${r.id}'})`}"><div class="type">${esc(r.note)}</div><div class="title">${esc(r.title)}</div></div>`).join(''):`<div class="search-result-item"><div class="title">No matches</div></div>`;
  searchResults.classList.add('open');
});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))searchResults.classList.remove('open');});

updateProgressChip();
render();
</script>
</body>
</html>
