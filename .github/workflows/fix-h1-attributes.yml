name: Fix Heading Attributes

on:
  push:
    branches: [react-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrap every unwrapped h1
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main.jsx')
          s=p.read_text()
          s=re.sub(r'<h1(?![^>]*WordHeading)([^>]*)>(?!\s*<WordHeading>)(.*?)</h1>',r'<h1\1><WordHeading>\2</WordHeading></h1>',s,flags=re.S)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git rm .github/workflows/fix-h1-attributes.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: apply word colours to attributed page headings'
          git push
