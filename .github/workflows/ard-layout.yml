name: ARD Layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append layout CSS
        run: |
          grep -q "ARD SIDEBAR WORKSPACE LAYOUT" style.css && exit 0
          cat >> style.css <<'CSS'

/* ARD SIDEBAR WORKSPACE LAYOUT */
html,body{width:100%;height:100%;overflow:hidden}
.app-shell{position:relative;display:block;width:100%;height:100vh;min-height:100vh}
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;height:56px}
.sidebar{position:fixed;top:56px;left:0;bottom:0;width:300px;height:calc(100vh - 56px);z-index:30;overflow-y:auto;overflow-x:hidden;padding:10px 0 40px}
.main{position:absolute;top:56px;left:300px;right:0;bottom:0;width:auto;height:calc(100vh - 56px);overflow-y:auto;overflow-x:hidden;padding:42px 56px 90px}
.main-inner{width:min(820px,100%);max-width:820px;margin:0 auto}
@media (max-width:860px){
  .app-shell{display:block}
  .topbar{height:56px}
  .sidebar{top:56px;bottom:0;left:0;width:76px;height:calc(100vh - 56px);max-height:none;border-right:1px solid var(--border);border-bottom:none;padding:10px 0 24px}
  .main{top:56px;left:76px;right:0;bottom:0;height:calc(100vh - 56px);padding:30px 28px 72px}
  .main-inner{max-width:820px}
  .nav-section-label,.stage-title,.stage-caret,.module-group,.stage-body{display:none}
  .nav-top-item,.stage-header{justify-content:center;padding:12px 8px;border-left:none}
  .nav-top-item{min-height:48px}
  .stage-item{border-bottom:none}
  .stage-num{margin:0}
  .stage-header{min-height:44px}
  .search-wrap{max-width:none}
  .brand span.full{display:none}
  .stage-meta-grid{grid-template-columns:1fr}
  .project-fields{grid-template-columns:1fr}
}
CSS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix sidebar as fixed navigation rail"
          git push
