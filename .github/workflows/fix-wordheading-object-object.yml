name: Fix WordHeading object rendering

on:
  push:
    branches: [react-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove accidental nested WordHeading wrappers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          s = s.replace('<WordHeading><WordHeading>', '<WordHeading>')
          s = s.replace('</WordHeading></WordHeading>', '</WordHeading>')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove nested WordHeading rendering'
          git push
