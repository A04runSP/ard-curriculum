name: Apply strong lesson colours

on:
  push:
    branches: [react-migration]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply strong lesson colour layer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load lesson colour CSS after page colours
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          link = '    <link rel="stylesheet" href="/src/lesson-colors.css" />'
          if link not in s:
              s = s.replace('    <link rel="stylesheet" href="/src/page-colors.css" />', '    <link rel="stylesheet" href="/src/page-colors.css" />\n' + link)
              p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/lesson-colors.css .github/workflows/strong-lesson-colours.yml
          git rm .github/workflows/strong-lesson-colours.yml
          git commit -m "Apply strong lesson colour layer"
          git push
