name: Temporary sidebar behavior patch

on:
  push:
    branches: [react-migration]

permissions:
  contents: write

jobs:
  patch-sidebar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-migration
          fetch-depth: 1

      - name: Patch mobile sidebar behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          old = "const [collapsed,setCollapsed]=useState(()=>localStorage.getItem('ard_sidebar_collapsed')==='1');"
          new = "const [collapsed,setCollapsed]=useState(()=>window.innerWidth<=520?false:localStorage.getItem('ard_sidebar_collapsed')==='1');"
          if old not in s:
              raise SystemExit('collapsed initializer not found')
          s = s.replace(old, new, 1)
          old = "<button className=\"mobile-filament\" onClick={()=>setFilamentOpen(v=>!v)} aria-expanded={filamentOpen} aria-label={filamentOpen?'Hide collapsed navigation':'Show collapsed navigation'}>"
          new = "<button className=\"mobile-filament\" onClick={()=>{if(window.innerWidth<=520){setCollapsed(true);setFilamentOpen(v=>!v)}else setFilamentOpen(v=>!v)}} aria-expanded={filamentOpen} aria-label={filamentOpen?'Collapse sidebar to icons':'Expand sidebar navigation'}>"
          if old not in s:
              raise SystemExit('mobile filament button not found')
          s = s.replace(old, new, 1)
          old = "<button className=\"collapse-btn\" onClick={()=>setCollapsed(!collapsed)} title={collapsed?'Expand navigation':'Collapse navigation'} aria-label={collapsed?'Expand navigation':'Collapse navigation'}>"
          new = "<button className=\"collapse-btn\" onClick={()=>{if(window.innerWidth<=520&&collapsed&&filamentOpen){setFilamentOpen(false)}else setCollapsed(!collapsed)}} title={collapsed&&filamentOpen?'Collapse to icon navigation':collapsed?'Expand navigation':'Collapse navigation'} aria-label={collapsed&&filamentOpen?'Collapse to icon navigation':collapsed?'Expand navigation':'Collapse navigation'}>"
          if old not in s:
              raise SystemExit('collapse button not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit behavior patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "Fix mobile sidebar expand and collapse behavior"
          git push origin react-migration
          git rm .github/workflows/temporary-sidebar-behavior.yml
          git commit -m "Remove temporary sidebar behavior workflow"
          git push origin react-migration
