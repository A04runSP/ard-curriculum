name: One-time mobile nav patch
on:
  push:
    branches: [react-migration]
permissions:
  contents: write
jobs:
  patch:
    if: github.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-migration
          fetch-depth: 0
      - name: Patch mobile outside click
        run: |
          python - <<'PY2'
          from pathlib import Path
          p=Path("src/main.jsx")
          s=p.read_text()
          old='<main className="main"><div className="main-inner">'
          new='<main className="main" onClick={e=>{if(!collapsed&&window.innerWidth<=520&&!e.target.closest(".sidebar"))setCollapsed(true)}}><div className="main-inner">'
          if old in s and 'window.innerWidth<=520' not in s:
              p.write_text(s.replace(old,new,1))
          PY2
          if ! grep -q 'Mobile outside-click layer closes the expanded navigation' src/styles.css; then
            cat >> src/styles.css <<'CSS'
          /* Mobile outside-click layer closes the expanded navigation. */
          @media(max-width:520px){
            .app-shell:not(.is-collapsed) .main::before{pointer-events:auto}
          }
          CSS
          fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Close mobile navigation when tapping outside"
          git push origin react-migration
