name: Fix full lesson colours

on:
  workflow_dispatch:
  push:
    branches: [react-migration]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply full lesson colour binding
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          anchor="function WordHeading({children}){"
          block="""const LESSON_COLORS={1:['#20E3E6','#39D5C6'],2:['#35C9FF','#7BE0FF'],3:['#4D7CFF','#8EADFF'],4:['#6675FF','#9AA4FF'],5:['#7C5CFF','#B59AFF'],6:['#9B6BFF','#C7A8FF'],7:['#C18CFF','#E0C8FF'],8:['#FF3EA5','#FF78AC'],9:['#FF5C9A','#FF9BBD'],10:['#FF78AC','#FFC1D6'],11:['#FF8A78','#FFB09F'],12:['#FFB38A','#FFD0B8'],13:['#FFE0A3','#FFF0C9'],14:['#FFD166','#FFE6A3'],15:['#39D5C6','#82F5D6']};
          const lessonStyle=num=>{const [a,b]=LESSON_COLORS[num]||LESSON_COLORS[1];return {'--lesson-a':a,'--lesson-b':b};};

          """
          if 'const LESSON_COLORS=' not in s:
              s=s.replace(anchor,block+anchor,1)
          old="const active=view.stage===stage.id;return <div className={'stage-item '+(open?'open ':'')+(active?'active-stage':'')}>"
          new="const active=view.view==='stage'?view.stage===stage.id:view.view==='lesson'&&lessons.some(l=>l.id===view.id);return <div className={'stage-item '+(open?'open ':'')+(active?'active-stage':'')} data-stage={stage.num}>"
          if old not in s: raise SystemExit('StageNav target not found')
          s=s.replace(old,new,1)
          old="return <div className=\"stage-view\"><div className=\"stage-eyebrow\">Stage {s.num} of 15</div>"
          new="return <div className=\"stage-view\" style={lessonStyle(s.num)} data-stage={s.num}><div className=\"stage-eyebrow\">Stage {s.num} of 15</div>"
          if old not in s: raise SystemExit('StageView target not found')
          s=s.replace(old,new,1)
          old="return <div className=\"lesson-view\"><div className=\"lesson-eyebrow\">{stage?.title} · {l.module}</div>"
          new="return <div className=\"lesson-view\" style={lessonStyle(stage?.num)} data-stage={stage?.num}><div className=\"lesson-eyebrow\">{stage?.title} · {l.module}</div>"
          if old not in s: raise SystemExit('LessonView target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/page-colors.css')
          s=p.read_text()
          marker='/* Full lesson colour binding: stage identity is carried by the rendered lesson view. */'
          css="""
          /* Full lesson colour binding: stage identity is carried by the rendered lesson view. */
          .stage-view .stage-eyebrow,.lesson-view .lesson-eyebrow{color:var(--lesson-a,#20E3E6)!important}
          .stage-view h1,.lesson-view h1{background:linear-gradient(100deg,#F7F5FA 0%,#F7F5FA 30%,var(--lesson-a,#20E3E6) 62%,var(--lesson-b,#39D5C6) 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important;-webkit-text-fill-color:transparent!important}
          .stage-view .subheading,.lesson-view .lsection h2{background:linear-gradient(100deg,var(--lesson-a,#20E3E6),var(--lesson-b,#39D5C6))!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
          .stage-item.active-stage .stage-num{border-color:var(--lesson-a,#20E3E6)!important;color:var(--lesson-a,#20E3E6)!important;box-shadow:0 0 14px var(--lesson-a,#20E3E6)!important}
          .stage-item[data-stage="1"]{--lesson-a:#20E3E6;--lesson-b:#39D5C6}.stage-item[data-stage="2"]{--lesson-a:#35C9FF;--lesson-b:#7BE0FF}.stage-item[data-stage="3"]{--lesson-a:#4D7CFF;--lesson-b:#8EADFF}.stage-item[data-stage="4"]{--lesson-a:#6675FF;--lesson-b:#9AA4FF}.stage-item[data-stage="5"]{--lesson-a:#7C5CFF;--lesson-b:#B59AFF}.stage-item[data-stage="6"]{--lesson-a:#9B6BFF;--lesson-b:#C7A8FF}.stage-item[data-stage="7"]{--lesson-a:#C18CFF;--lesson-b:#E0C8FF}.stage-item[data-stage="8"]{--lesson-a:#FF3EA5;--lesson-b:#FF78AC}.stage-item[data-stage="9"]{--lesson-a:#FF5C9A;--lesson-b:#FF9BBD}.stage-item[data-stage="10"]{--lesson-a:#FF78AC;--lesson-b:#FFC1D6}.stage-item[data-stage="11"]{--lesson-a:#FF8A78;--lesson-b:#FFB09F}.stage-item[data-stage="12"]{--lesson-a:#FFB38A;--lesson-b:#FFD0B8}.stage-item[data-stage="13"]{--lesson-a:#FFE0A3;--lesson-b:#FFF0C9}.stage-item[data-stage="14"]{--lesson-a:#FFD166;--lesson-b:#FFE6A3}.stage-item[data-stage="15"]{--lesson-a:#39D5C6;--lesson-b:#82F5D6}
          .stage-item.active-stage .lesson-link.active{color:var(--lesson-a)!important;box-shadow:inset 2px 0 var(--lesson-a),inset 0 1px 0 var(--gloss-highlight-soft)}
          """
          if marker not in s: s += '\n'+css
          p.write_text(s)
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/page-colors.css .github/workflows/fix-full-lesson-colors.yml
          git commit -m "Apply lesson colours to every stage and full lesson" || exit 0
          git rm .github/workflows/fix-full-lesson-colors.yml
          git commit -m "Remove temporary lesson colour fix workflow"
          git push
