name: Update stage card glass styling
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          old = 'title="The 15 Stages"><span className="stage-index-icon">15</span><span className="stage-index-text">The 15 Stages</span>'
          new = 'title="15 - Lessons"><span className="stage-index-icon">15</span><span className="stage-index-text">15 - Lessons</span>'
          if old not in s:
              raise SystemExit('Sidebar 15-stage label not found')
          p.write_text(s.replace(old, new, 1))

          css = Path('src/styles.css')
          extra = r'''

/* Glass stage cards: glossy environment, translucent elevated panels */
.stage-index-card{
  background:linear-gradient(145deg,rgba(35,34,58,.68),rgba(12,13,27,.58)) !important;
  border:1px solid rgba(255,255,255,.14) !important;
  backdrop-filter:blur(16px) saturate(125%);
  -webkit-backdrop-filter:blur(16px) saturate(125%);
  box-shadow:0 18px 38px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.10),0 0 18px color-mix(in srgb,var(--lesson-a) 7%,transparent) !important;
}
.stage-index-card::before{
  content:"";
  position:absolute;
  inset:1px 14% auto 14%;
  height:1px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent);
  pointer-events:none;
}
.stage-index-card:hover{
  transform:translateY(-5px) !important;
  border-color:color-mix(in srgb,var(--lesson-a) 42%,rgba(255,255,255,.14)) !important;
  box-shadow:0 24px 44px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.14),0 0 22px color-mix(in srgb,var(--lesson-a) 13%,transparent) !important;
}
.stage-card-num{
  background:rgba(255,255,255,.035) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
'''
          marker = '/* Glass stage cards: glossy environment, translucent elevated panels */'
          if marker not in css.read_text():
              css.write_text(css.read_text() + extra)

      - name: Build
        run: npm install && npm run build

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/styles.css .github/workflows/stage-cards-glass.yml
          git commit -m "Use glass stage cards and rename 15 lessons navigation" || exit 0
          git rm .github/workflows/stage-cards-glass.yml
          git commit -m "Remove temporary stage card update workflow"
          git push