name: Add dedicated stages navigation

on:
  push:
    branches: [react-migration]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: react-migration
          fetch-depth: 0

      - name: Patch navigation and styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('src/main.jsx')
          text = main.read_text()

          old_sidebar = '''function Sidebar({collapsed,setCollapsed,view,navigate,progress}){return <aside className="sidebar"><div className="rail-logo"><span className="rail-mark">ϟ</span><span className="rail-label">ARD</span></div><div className="sidebar-scroll"><div className="nav-section-label">Navigate</div>{TOP_ITEMS.map(([icon,label,id])=><button key={id||icon} className={'nav-top-item '+((view.view===(id||icon))?'active':'')} onClick={()=>navigate({view:id||icon})} title={label}><Icon name={icon}/><span>{label}</span></button>)}<div className="nav-section-label stages-label">The 15 Stages</div>{stages.map(s=><StageNav key={s.id} stage={s} view={view} navigate={navigate} progress={progress} collapsed={collapsed}/>)}</div><div className="sidebar-footer"><button className="collapse-btn" onClick={()=>setCollapsed(!collapsed)} title={collapsed?'Expand navigation':'Collapse navigation'} aria-label={collapsed?'Expand navigation':'Collapse navigation'}><Icon name="collapse" size={21}/><span>{collapsed?'':'Collapse sidebar'}</span></button></div></aside>}'''
          new_sidebar = '''function Sidebar({collapsed,setCollapsed,view,navigate,progress}){return <aside className="sidebar"><div className="rail-logo"><span className="rail-mark">ϟ</span><span className="rail-label">ARD</span></div><div className="sidebar-scroll"><div className="nav-section-label">Navigate</div>{TOP_ITEMS.map(([icon,label,id])=><button key={id||icon} className={'nav-top-item '+((view.view===(id||icon))?'active':'')} onClick={()=>navigate({view:id||icon})} title={label}><Icon name={icon}/><span>{label}</span></button>)}<div className="nav-section-label stages-label">Curriculum</div><button className={'stages-index-link '+((view.view==='stages'||view.view==='stage'||view.view==='lesson'||view.view==='concept')?'active':'')} onClick={()=>navigate({view:'stages'})} title="The 15 Stages"><span className="stage-index-icon">15</span><span className="stage-index-text">The 15 Stages</span><span className="stage-index-arrow">→</span></button></div><div className="sidebar-footer"><button className="collapse-btn" onClick={()=>setCollapsed(!collapsed)} title={collapsed?'Expand navigation':'Collapse navigation'} aria-label={collapsed?'Expand navigation':'Collapse navigation'}><Icon name="collapse" size={21}/><span>{collapsed?'':'Collapse sidebar'}</span></button></div></aside>}'''
          if old_sidebar not in text:
              raise SystemExit('Sidebar block not found')
          text = text.replace(old_sidebar, new_sidebar, 1)

          old_router = "function RouterView({view,navigate,progress,toggleDone}){switch(view.view){case'dashboard':return <Dashboard navigate={navigate} progress={progress}/>;case'stage':return <StageView id={view.stage} navigate={navigate} progress={progress}/>;case'lesson':return <LessonView id={view.id} navigate={navigate} progress={progress} toggleDone={toggleDone}/>;case'concept':return <ConceptView id={view.id} navigate={navigate}/>;case'skill-matrix':return <SkillMatrix/>;case'tools':return <Tools/>;case'resources':return <Resources/>;case'projects':return <Projects/>;case'methodology':return <Methodology/>;default:return <Dashboard navigate={navigate} progress={progress}/>}}"
          new_router = "function RouterView({view,navigate,progress,toggleDone}){switch(view.view){case'dashboard':return <Dashboard navigate={navigate} progress={progress}/>;case'stages':return <StagesView navigate={navigate} progress={progress}/>;case'stage':return <StageView id={view.stage} navigate={navigate} progress={progress}/>;case'lesson':return <LessonView id={view.id} navigate={navigate} progress={progress} toggleDone={toggleDone}/>;case'concept':return <ConceptView id={view.id} navigate={navigate}/>;case'skill-matrix':return <SkillMatrix/>;case'tools':return <Tools/>;case'resources':return <Resources/>;case'projects':return <Projects/>;case'methodology':return <Methodology/>;default:return <Dashboard navigate={navigate} progress={progress}/>}}"
          if old_router not in text:
              raise SystemExit('Router block not found')
          text = text.replace(old_router, new_router, 1)

          marker = "function Stat({n,label}){return <div className=\"stat-box\"><div className=\"num\">{n}</div><div className=\"label\">{label}</div></div>}"
          stages_view = '''function StagesView({navigate,progress}){const done=allLessons.filter(l=>progress[l.id]).length;return <div className="stages-index"><div className="stages-index-hero"><div className="eyebrow">ARD Curriculum · Curriculum Map</div><h1><WordHeading>The 15 Stages</WordHeading></h1><p>Explore the curriculum as a clear progression from absolute beginner to professional practical ability. Open a stage to see its objectives, skills, projects, lessons, and concept notes.</p><div className="stages-index-stats"><Stat n="15" label="Stages"/><Stat n={allLessons.length} label="Full lessons"/><Stat n={conceptCards.length} label="Concept notes"/><Stat n={done+'/'+allLessons.length} label="Completed"/></div></div><div className="stage-index-grid">{stages.map(s=>{const lessons=allLessons.filter(l=>l.stage===s.id),concepts=conceptCards.filter(c=>c.stage===s.id),complete=lessons.filter(l=>progress[l.id]).length;return <button className="stage-index-card" key={s.id} style={lessonStyle(s.num)} onClick={()=>navigate({view:'stage',stage:s.id})}><div className="stage-card-top"><span className="stage-card-num">{String(s.num).padStart(2,'0')}</span><span className="stage-card-arrow">→</span></div><h2>{s.title}</h2><p>{s.objective}</p><div className="stage-card-meta"><span>{lessons.length} {lessons.length===1?'lesson':'lessons'}</span><span>{concepts.length} {concepts.length===1?'concept':'concepts'}</span></div>{lessons.length>0&&<div className="stage-card-progress"><span style={{width:`${Math.round(complete/lessons.length*100)}%`}}/></div>}</button>})}</div></div>}'''
          if marker not in text:
              raise SystemExit('Stat marker not found')
          text = text.replace(marker, marker+'\n'+stages_view, 1)

          old_stage_return = '''return <div className="stage-view" style={lessonStyle(s.num)} data-stage={s.num}><div className="stage-eyebrow">Stage {s.num} of 15</div>'''
          new_stage_return = '''return <div className="stage-view" style={lessonStyle(s.num)} data-stage={s.num}><button className="stage-back-btn" onClick={()=>navigate({view:'stages'})}>← All 15 stages</button><div className="stage-eyebrow">Stage {s.num} of 15</div>'''
          if old_stage_return not in text:
              raise SystemExit('StageView marker not found')
          text = text.replace(old_stage_return, new_stage_return, 1)

          old_lesson_return = '''return <div className="lesson-view" style={lessonStyle(stage?.num)} data-stage={stage?.num}><div className="lesson-eyebrow">'''
          new_lesson_return = '''return <div className="lesson-view" style={lessonStyle(stage?.num)} data-stage={stage?.num}><button className="stage-back-btn lesson-back-btn" onClick={()=>navigate({view:'stage',stage:l.stage})}>← {stage?.title||'Stage'}</button><div className="lesson-eyebrow">'''
          if old_lesson_return not in text:
              raise SystemExit('LessonView marker not found')
          text = text.replace(old_lesson_return, new_lesson_return, 1)

          main.write_text(text)

          css = Path('src/styles.css')
          css_text = css.read_text()
          css_text += '''\n\n/* Dedicated 15-stage curriculum index */\n.stages-index{max-width:1180px;margin:0 auto;padding-bottom:48px}\n.stages-index-hero{margin-bottom:30px}\n.stages-index-hero h1{margin:8px 0 12px;font-size:clamp(32px,5vw,46px);line-height:1.05}\n.stages-index-hero>p{max-width:760px;margin:0;color:var(--text-muted,#aaa7b8);font-size:16px;line-height:1.7}\n.stages-index-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}\n.stages-index-stats .stat-box{min-height:88px}\n.stage-index-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}\n.stage-index-card{position:relative;display:block;width:100%;padding:22px;text-align:left;border:1px solid color-mix(in srgb,var(--lesson-a) 24%,rgba(255,255,255,.08));border-radius:20px;background:linear-gradient(145deg,rgba(30,29,58,.96),rgba(14,14,28,.98));box-shadow:0 16px 34px rgba(0,0,0,.25),0 0 24px color-mix(in srgb,var(--lesson-a) 8%,transparent);color:inherit;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}\n.stage-index-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--lesson-a) 58%,rgba(255,255,255,.1));box-shadow:0 20px 40px rgba(0,0,0,.3),0 0 28px color-mix(in srgb,var(--lesson-a) 18%,transparent)}\n.stage-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}\n.stage-card-num{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:34px;padding:0 10px;border-radius:10px;border:1px solid color-mix(in srgb,var(--lesson-a) 48%,transparent);background:color-mix(in srgb,var(--lesson-a) 9%,transparent);color:var(--lesson-a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700}\n.stage-card-arrow{color:var(--lesson-a);font-size:20px}\n.stage-index-card h2{margin:0 0 8px;font-size:21px;color:#f7f5fa}\n.stage-index-card p{margin:0;min-height:58px;color:var(--text-muted,#aaa7b8);font-size:13px;line-height:1.6}\n.stage-card-meta{display:flex;gap:16px;margin-top:16px;color:color-mix(in srgb,var(--lesson-a) 78%,#f7f5fa);font-size:12px;font-weight:700}\n.stage-card-progress{height:4px;margin-top:14px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}\n.stage-card-progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--lesson-a),var(--lesson-b))}\n.stages-index-link{display:flex;align-items:center;gap:11px;width:calc(100% - 16px);margin:8px 8px 0;padding:11px 12px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:transparent;color:var(--text-muted,#aaa7b8);text-align:left;cursor:pointer;transition:.18s ease}\n.stages-index-link:hover,.stages-index-link.active{border-color:color-mix(in srgb,var(--lesson-a,#20E3E6) 45%,transparent);background:color-mix(in srgb,var(--lesson-a,#20E3E6) 10%,transparent);color:#f7f5fa}\n.stage-index-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.14);font-size:11px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--lesson-a,#20E3E6)}\n.stage-index-text{font-size:13px;font-weight:700;flex:1}\n.stage-index-arrow{font-size:18px;color:var(--lesson-a,#20E3E6)}\n.stage-back-btn{display:inline-flex;align-items:center;gap:7px;margin:0 0 18px;padding:8px 12px;border:1px solid color-mix(in srgb,var(--lesson-a,#20E3E6) 30%,rgba(255,255,255,.08));border-radius:10px;background:color-mix(in srgb,var(--lesson-a,#20E3E6) 7%,transparent);color:var(--lesson-a,#20E3E6);font-size:12px;font-weight:700;cursor:pointer}\n.stage-back-btn:hover{border-color:color-mix(in srgb,var(--lesson-a,#20E3E6) 60%,transparent);background:color-mix(in srgb,var(--lesson-a,#20E3E6) 12%,transparent)}\n@media(max-width:720px){.stage-index-grid{grid-template-columns:1fr}.stages-index-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stage-index-card{padding:19px}.stage-index-card p{min-height:0}}\n@media(max-width:520px){.stages-index{padding-bottom:32px}.stages-index-hero h1{font-size:34px}.stages-index-hero>p{font-size:14px;line-height:1.65}.stages-index-stats{gap:8px}.stage-index-card{border-radius:17px}.stage-index-card h2{font-size:19px}.stages-index-link{width:48px;justify-content:center;padding:9px;margin-left:8px}.stage-index-text,.stage-index-arrow{display:none}.stage-index-icon{width:32px}}\n'''
          css.write_text(css_text)
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stages-navigation.yml
          git add src/main.jsx src/styles.css
          git commit -m "Create dedicated 15-stage curriculum page"
          git push origin react-migration
